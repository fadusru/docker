# на момент подготовки конфига тег latest проставлен на версии:
# 7.1.0-apache, 7.1-apache, 7-apache, apache, 7.1.0, 7.1, 7, latest, 7.1.0-php8.3-apache, 7.1-php8.3-apache,
# 7-php8.3-apache, php8.3-apache, 7.1.0-php8.3, 7.1-php8.3, 7-php8.3, php8.3⁠
# За основу взята конфигурация со страницы на Docker Hub: https://hub.docker.com/_/wordpress
services:

  wordpress:
    image: wordpress:latest
    restart: always
    ports:
      - 8080:80
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: exampleuser
      WORDPRESS_DB_PASSWORD: examplepass
      WORDPRESS_DB_NAME: exampledb
    volumes:
      - wordpress:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: exampledb
      MYSQL_USER: exampleuser
      MYSQL_PASSWORD: examplepass
      MYSQL_RANDOM_ROOT_PASSWORD: '1'
    volumes:
      - db:/var/lib/mysql

volumes:
  wordpress:
  db: