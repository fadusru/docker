# На момент подготовки конфигурации тег latest проставлен на версии 1.27.3
# Если предполагается использовать Gitea в многопользовательском режиме, рекомендуется создать отдельного пользователя,
# например, git и дать ему права на каталог с данными, так будет безопаснее для сервера
services:
  gitea:
    image: gitea/gitea:1.27.3
    container_name: gitea
    restart: unless-stopped
    environment:
      - USER_UID=1000 # <YOUR UID>
      - USER_GID=1000 # <YOUR GID>
    volumes:
      - ./gitea:/data
#      - /home/git/.ssh/:/data/git/.ssh
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3100:3000" # У меня порт 3000 занят, верните обратно, если у Вас свободен
      - "2222:22"
    networks:
      - gitea-net

networks:
  gitea-net:
    driver: bridge
    external: false