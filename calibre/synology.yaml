# На момент подготовки конфигурации тег latest стоя на сборке 9.14.0
services:
  calibre:
    image: linuxserver/calibre:latest
    container_name: calibre
    restart: unless-stopped
    environment:
      - PUID=1026
      - PGID=100
      - TZ=Europe/Moskow
      - CUSTOM_USER=abc
      - PASSWORD=abc
    ports:
      - 8080:8080
      - 8181:8181
      - 8081:8081
    volumes:
      - "./calibre-config:/config"
      - "./calibre-library:/config/Calibre Library"
    networks:
      - calibre-net

networks:
  calibre-net:
    driver: bridge